services:
  postgres:
    image: postgres:16-alpine
    container_name: pharma-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: pharma
      POSTGRES_PASSWORD: pharma
      POSTGRES_DB: pharma_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pharma -d pharma_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: pharma-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://pharma:pharma@postgres:5432/pharma_db
      JWT_SECRET: change-me-in-production-min-32-chars
      JWT_ALGORITHM: HS256
      JWT_EXPIRE_MINUTES: 720
      HASHCHAIN_SECRET: change-me-demo-only
      STORAGE_DIR: /app/storage
      CORS_ORIGINS: http://localhost:5173,http://frontend:5173
    ports:
      - "8000:8000"
    volumes:
      - ./backend/storage:/app/storage
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

  frontend:
    build: ./frontend
    container_name: pharma-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"
    environment:
      VITE_API_URL: http://localhost:8000

volumes:
  pgdata:
